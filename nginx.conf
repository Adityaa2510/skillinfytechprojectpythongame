events {}

http {
    upstream snake_arena_api {
        server api1:5000;
        server api2:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://snake_arena_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
    }
}