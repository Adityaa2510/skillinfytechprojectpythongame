services:
  api1:
    build: .
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:5000
      - --workers
      - "2"
      - api:app
    environment:
      INSTANCE_ID: "api-replica-1"
    expose:
      - "5000"
    restart: unless-stopped

  api2:
    build: .
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:5000
      - --workers
      - "2"
      - api:app
    environment:
      INSTANCE_ID: "api-replica-2"
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    restart: unless-stopped
