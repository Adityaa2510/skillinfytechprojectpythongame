name: Snake Arena DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # ==========================================
  # STAGE 1: CODE QUALITY AND SECURITY CHECKS
  # ==========================================

  tests:
    name: Tests and Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Check Python syntax
        run: python -m compileall -q game.py game_logic.py api.py tests

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install "bandit>=1.8,<2.0"

      - name: Scan application source
        run: python -m bandit -r game.py game_logic.py api.py

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --source=/repo --redact --exit-code=1

  # ==========================================
  # STAGE 2: BUILD DOCKER IMAGE
  # Wait for all security checks to pass
  # ==========================================

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - tests
      - sast
      - dependency-audit
      - secret-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t snake-arena:${{ github.sha }} .

      - name: Save image artifact
        run: docker save snake-arena:${{ github.sha }} -o snake-arena.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-arena-image
          path: snake-arena.tar
          retention-days: 1

  # ==========================================
  # STAGE 3: TEST DOCKER IMAGE
  # ==========================================

  test:
    name: Test Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: snake-arena-image

      - name: Load Docker image
        run: docker load -i snake-arena.tar

      - name: Run unit tests inside Docker
        run: docker run --rm snake-arena:${{ github.sha }} python -m pytest -v

      - name: Container smoke test
        run: |
          docker run --rm snake-arena:${{ github.sha }} \
            python -c "import pygame, game_logic, api; print('Container smoke test passed')"

  # ==========================================
  # STAGE 4: NGINX LOAD BALANCING INTEGRATION
  # ==========================================

  load-balancing-test:
    name: Nginx Load Balancing Integration Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start API replicas and Nginx
        run: docker compose up --build -d

      - name: Validate Nginx configuration
        run: docker compose exec -T nginx nginx -t

      - name: Test API health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "API health check failed"
          docker compose logs
          exit 1

      - name: Verify both API replicas receive traffic
        run: bash tests/test_load_balancing.sh

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Compose services
        if: always()
        run: docker compose down

  # ==========================================
  # STAGE 5: DEPLOY TO DOCKER HUB
  # Only deploy pushes to main
  # ==========================================

  deploy:
    name: Deploy to Docker Hub
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - load-balancing-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download tested image artifact
        uses: actions/download-artifact@v4
        with:
          name: snake-arena-image

      - name: Load Docker image
        run: docker load -i snake-arena.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag tested image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag snake-arena:${{ github.sha }} \
            "$DOCKERHUB_USERNAME/snake-arena:${{ github.sha }}"

          docker tag snake-arena:${{ github.sha }} \
            "$DOCKERHUB_USERNAME/snake-arena:latest"

      - name: Push image to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push "$DOCKERHUB_USERNAME/snake-arena:${{ github.sha }}"
          docker push "$DOCKERHUB_USERNAME/snake-arena:latest"