name: Snake Arena DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests and Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Check Python syntax
        run: python -m compileall -q game.py game_logic.py tests

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install "bandit>=1.8,<2.0"

      - name: Scan application source
        run: python -m bandit -r game.py game_logic.py

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --source=/repo --redact --exit-code=1

  build-test-deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest
    needs: [tests, sast, dependency-audit, secret-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t snake-arena:${{ github.sha }} .

      - name: Test inside Docker
        run: docker run --rm snake-arena:${{ github.sha }} python -m pytest -v

      - name: Container smoke test
        run: docker run --rm snake-arena:${{ github.sha }} python -c "import pygame, game_logic; print('Container OK')"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag snake-arena:${{ github.sha }} "$DOCKERHUB_USERNAME/snake-arena:${{ github.sha }}"
          docker tag snake-arena:${{ github.sha }} "$DOCKERHUB_USERNAME/snake-arena:latest"
          docker push "$DOCKERHUB_USERNAME/snake-arena:${{ github.sha }}"
          docker push "$DOCKERHUB_USERNAME/snake-arena:latest"